# a32wifishim — keep helper interfaces out of NetworkManager.
# mon1 (frame injection) and ap1 (hostapd's AP interface) are daemon-owned;
# showing them in the applet only invites mis-clicks — neither answers NM.
# Installed to /etc/NetworkManager/conf.d/a32wifishim.conf by install.sh.
# Runtime equivalent (for manual runs without the installer) is e.g.
#   nmcli device set ap1 managed no
[device]
match-device=interface-name:mon1,interface-name:ap1
managed=false
