# a32router.conf — user configuration. Sourced by a32routerd/uninstall.sh.
# USB subnet for the PC link. Must NOT overlap the Wi-Fi LAN.
USB_SUBNET=192.168.50.0/24
USB_IP=192.168.50.1
USB_PREFIX=24
# Phone-side RNDIS MAC is kernel-assigned (configfs attr writes denied);
# USB_MAC below is informational/fallback only.
USB_MAC=02:A3:32:50:00:01
# Gadget identifiers (stock Samsung values; keep for driver stability).
GADGET_VID=0x04e8
GADGET_PID=0x685d
# Tick interval (seconds) for the monitor loop.
TICK=5
# Set to 1 to also serve DHCP on the USB link via dnsmasq (default 0 = static PC config).
# DHCP offers address + DNS ONLY, never a gateway (see test/03 log): the PC
# operator takes over the default route explicitly during tests.
USB_DHCP=0
# Set to 1 to enable Bluetooth HCI export experiments (phase 2, default off).
BT_EXPORT=0
# Shim (PC control + BT relay). Binds ONLY to USB_IP.
SHIM=1
SHIM_WIFI_PORT=33601
SHIM_BT_PORT=33600
